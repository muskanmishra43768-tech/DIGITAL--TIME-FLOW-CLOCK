<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeFlow - Stopwatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">⏱ TimeFlow</div>

        <nav>
            <a href="index.html">🏠 Dashboard</a>
            <a href="world-clock.html">🌍 World Clock</a>
            <a href="stopwatch.html" class="active">⏱ Stopwatch</a>
            <a href="countdown.html">⌛ Countdown</a>
            <a href="alarm.html">🔔 Alarm</a>
        </nav>

        <div class="sidebar-bottom">
            <p>Made with ❤️</p>
            <small>TimeFlow v1.0</small>
        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h2>Stopwatch ⏱</h2>
                <p>Track every second.</p>
            </div>
        </header>

        <section class="welcome">
            <h1>My Stopwatch</h1>
            <p>Measure time with precision.</p>
        </section>

        <section class="stopwatch-container">

            <div id="stopwatchDisplay">00:00:00.00</div>

            <div class="stopwatch-buttons">

                <button id="startBtn">▶ Start</button>

                <button id="pauseBtn">⏸ Pause</button>

                <button id="resetBtn">🔄 Reset</button>

                <button id="lapBtn">🏁 Lap</button>
                <ul id="lapList"></ul>

            </div>

            <div class="lap-section">

                <h3>Lap Records</h3>

                <ul id="lapList"></ul>

            </div>

        </section>

        <footer>
            © 2026 TimeFlow | All Rights Reserved ❤️
        </footer>

    </main>

</div>

<script src="stopwatch.js"></script>

</body>
</html>
